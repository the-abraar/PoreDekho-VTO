<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jewellery Try-On (on-device)</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;text-align:center}
main{max-width:640px;margin:0 auto;padding:12px}
canvas{width:100%;height:auto;background:#000;border-radius:8px;aspect-ratio:4/3}
button{font:inherit;padding:10px 14px;margin:4px;border-radius:6px;border:1px solid #888;background:#222;color:#eee;min-height:44px}
button[aria-pressed=true]{background:#c9a24b;color:#000;border-color:#c9a24b}
#msg{min-height:1.4em;color:#ffb4a8}
details{margin:8px 0;text-align:left}label{display:block;margin:6px 0}input[type=range]{width:100%}
small{color:#aaa;display:block;margin-top:8px}
</style></head><body><main>
<h1 style="font-size:1.2rem">Jewellery Try-On</h1>
<p id="msg" role="status">Starting camera...</p>
<canvas id="c" width="640" height="480"></canvas>
<div id="earBtns" aria-label="Earrings"></div>
<div id="neckBtns" aria-label="Necklaces"></div>
<details id="tune"><summary>Tuning (placement untested on real faces)</summary>
<div id="sliders"></div><button id="tuneReset" type="button">Reset</button></details>
<button id="snap">Save snapshot (PNG)</button>
<small>Hair, hijab or scarves are not detected, so jewellery is drawn on top of them. On-device only: camera frames are processed in your browser and never leave your phone. Placeholder shapes, not real products. <a href="index.html" style="color:#c9a24b">Back</a></small>
</main>
<video id="v" playsinline muted hidden></video>
<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
// Indices verified against FACEMESH_FACE_OVAL (mediapipe face_mesh_connections.py) and tfjs-models faceOval contour:
// chin 152, face sides 234 (subject's right) & 454 (left), jaw corners 172 & 397 are all oval points.
// Earlobe has no official landmark: 132 & 361 are oval contour points just below 234/454 on the jaw-line toward the ear
// (oval order ...172,58,132,93,234), the closest defensible proxy.
// Note: earrings/necklace are drawn over the video; hair, hijab or scarves are NOT occluded (no segmentation).
const L_LOBE = 132, R_LOBE = 361, L_SIDE = 234, R_SIDE = 454, CHIN = 152, L_JAW = 172, R_JAW = 397;
const $ = id => document.getElementById(id), msg = $("msg"), cv = $("c"), ctx = cv.getContext("2d"), vid = $("v");
const say = t => msg.textContent = t;

// Placeholder products: draw(ctx, size) centered at origin, hanging down.
const EAR = {
  "Drop": (g, s) => { g.fillStyle = "#c9a24b"; g.beginPath(); g.arc(0, 0, s*.08, 0, 7); g.fill(); g.beginPath(); g.moveTo(0, s*.08); g.quadraticCurveTo(s*.2, s*.35, 0, s*.5); g.quadraticCurveTo(-s*.2, s*.35, 0, s*.08); g.fill(); },
  "Hoop": (g, s) => { g.strokeStyle = "#d8d8d8"; g.lineWidth = s*.06; g.beginPath(); g.arc(0, s*.25, s*.25, 0, 7); g.stroke(); },
  "Stud": (g, s) => { g.fillStyle = "#e33"; g.beginPath(); g.arc(0, 0, s*.12, 0, 7); g.fill(); g.strokeStyle = "#c9a24b"; g.lineWidth = s*.03; g.stroke(); },
};
const NECK = {
  "Chain": (g, w) => { g.strokeStyle = "#c9a24b"; g.lineWidth = w*.02; g.beginPath(); g.moveTo(-w/2, 0); g.quadraticCurveTo(0, w*.7, w/2, 0); g.stroke(); },
  "Pendant": (g, w) => { NECK.Chain(g, w); g.fillStyle = "#3a7bd5"; g.beginPath(); g.moveTo(0, w*.35); g.lineTo(w*.07, w*.45); g.lineTo(0, w*.58); g.lineTo(-w*.07, w*.45); g.fill(); },
  "Beads": (g, w) => { g.fillStyle = "#f2efe6"; for (let i = 0; i <= 12; i++) { const t = i/12, x = (t-.5)*w, y = 4*t*(1-t)*w*.33; g.beginPath(); g.arc(x, y, w*.025, 0, 7); g.fill(); } },
};
let ear = "Drop", neck = "Chain";
function buttons(el, set, get, put) {
  for (const k in set) { const b = document.createElement("button"); b.textContent = k; b.onclick = () => { put(k); render(); }; el.append(b); }
  const render = () => [...el.children].forEach(b => b.setAttribute("aria-pressed", b.textContent === get()));
  render();
}
buttons($("earBtns"), EAR, () => ear, k => ear = k);
buttons($("neckBtns"), NECK, () => neck, k => neck = k);
$("snap").onclick = () => { const a = document.createElement("a"); a.download = "tryon.png"; a.href = cv.toDataURL("image/png"); a.click(); };

// Tuning panel: fractions of face width, saved in localStorage (may throw in private mode, so always try/catch).
const TUNE = {earX: ["Earring sideways offset", .02, -.2, .2], earY: ["Earring vertical offset", .03, -.2, .3], earS: ["Earring scale", .45, .15, .9], neckY: ["Necklace vertical offset", .28, -.1, .8]};
const T = {}; for (const k in TUNE) T[k] = TUNE[k][1];
try { Object.assign(T, JSON.parse(localStorage.getItem("tryonTune") || "{}")); } catch (e) {}
const saveT = () => { try { localStorage.setItem("tryonTune", JSON.stringify(T)); } catch (e) {} };
const ins = {};
for (const k in TUNE) {
  const [name, , lo, hi] = TUNE[k], l = document.createElement("label"), i = document.createElement("input");
  i.type = "range"; i.min = lo; i.max = hi; i.step = .005; i.value = T[k];
  i.oninput = () => { T[k] = +i.value; saveT(); };
  l.append(name + " ", i); $("sliders").append(l); ins[k] = i;
}
$("tuneReset").onclick = () => { for (const k in TUNE) ins[k].value = T[k] = TUNE[k][1]; saveT(); };

// Exponential moving average per tracked point
const A = 0.4, sm = {};
const ema = (k, p) => { const o = sm[k]; return sm[k] = o ? {x: o.x + A*(p.x-o.x), y: o.y + A*(p.y-o.y)} : p; };

function draw(lm) {
  const W = cv.width, H = cv.height;
  const P = (k, i) => ema(k, {x: (1 - lm[i].x) * W, y: lm[i].y * H}); // mirrored like a selfie view
  const ls = P("ls", L_SIDE), rs = P("rs", R_SIDE), ll = P("ll", L_LOBE), rl = P("rl", R_LOBE);
  const chin = P("ch", CHIN), lj = P("lj", L_JAW), rj = P("rj", R_JAW);
  const faceW = Math.hypot(rs.x - ls.x, rs.y - ls.y), roll = Math.atan2(rs.y - ls.y, rs.x - ls.x);
  for (const [p, dir] of [[ll, -1], [rl, 1]]) {
    ctx.save(); ctx.translate(p.x + dir*faceW*T.earX, p.y + faceW*T.earY); ctx.rotate(roll); EAR[ear](ctx, faceW*T.earS); ctx.restore();
  }
  // necklace: centered below chin, width from jaw corners, rolled with head
  const nw = Math.hypot(rj.x - lj.x, rj.y - lj.y) * 1.3;
  ctx.save(); ctx.translate(chin.x, chin.y + faceW*T.neckY); ctx.rotate(roll); NECK[neck](ctx, nw); ctx.restore();
}

async function main() {
  if (!navigator.mediaDevices?.getUserMedia) return say("Camera not supported in this browser (needs HTTPS).");
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: 640, height: 480}, audio: false});
    await vid.play();
  } catch (e) {
    return say(e.name === "NotAllowedError" ? "Camera permission denied. Allow camera access in your browser settings and reload."
      : e.name === "NotFoundError" || e.name === "OverconstrainedError" ? "No camera found on this device." : "Could not start camera: " + e.name);
  }
  say("Loading face model...");
  let fl;
  try {
    fl = await FaceLandmarker.createFromOptions(await FilesetResolver.forVisionTasks(WASM),
      {baseOptions: {modelAssetPath: MODEL}, runningMode: "VIDEO", numFaces: 1});
  } catch (e) { return say("Could not load the face model (network or unsupported browser): " + e.message); }
  say("Look at the camera.");
  let last = -1;
  (function loop() {
    if (vid.currentTime !== last) {
      last = vid.currentTime;
      ctx.save(); ctx.scale(-1, 1); ctx.drawImage(vid, -cv.width, 0, cv.width, cv.height); ctx.restore();
      const r = fl.detectForVideo(vid, performance.now());
      if (r.faceLandmarks[0]) draw(r.faceLandmarks[0]); else { for (const k in sm) delete sm[k]; }
    }
    requestAnimationFrame(loop);
  })();
}
main();
</script></body></html>
